  note: "729 tests at the patch commit, 0 of them skipped by the suite, 0 failed, 0 errors. Axis's own SAAJ 1.2 API (build/lib/saaj.jar) is first on the boot class path, as on the JDKs Axis 1.4 was released for, which had no javax.xml.soap. JUnit 3 runs test methods in the JVM's reflection order, which differs between runs on Java 7; test.servicedesc.TestServiceDesc#testFaultSynch and test.utils.TestXMLUtils#testSAXXXE1 depend on that order, failed at the baseline in some runs (this batch's first baseline run included), and passed in this run. One line beyond upstream's fix: ClassUtils.loadClass's 1.4-only registered-classloader branch passes the init flag."
